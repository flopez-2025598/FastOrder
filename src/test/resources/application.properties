spring.application.name=fastorder-test

# Pruebas JUnit: H2 en memoria en modo PostgreSQL (no requiere tener PostgreSQL levantado)
spring.datasource.url=jdbc:h2:mem:fastorder_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=15000;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# data.sql se ejecuta después de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

jwt.secret=FastOrderTestSecretKeyThatIsDefinitelyLongerThan32Bytes!!
jwt.expiration=3600000

fastorder.costo-envio=20.00
server.error.include-stacktrace=never
