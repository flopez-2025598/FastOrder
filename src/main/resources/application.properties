spring.application.name=fastorder

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fastorder_fares_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.hikari.maximum-pool-size=20

# Crear la base de datos si no existe
fastorder.db.auto-create=true

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Cargar data.sql despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=${JWT_SECRET:FastOrderSecretKeyForJwtWhichMustBeAtLeast32BytesLong!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Costo fijo de envio en quetzales
fastorder.costo-envio=20.00

# No mostrar trazas de errores al cliente
server.error.include-stacktrace=never

# Puerto del servidor
server.port=${PORT:8080}